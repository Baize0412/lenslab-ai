<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f8f3" />
  <meta name="description" content="拍照或选择照片，获取常见物品的垃圾分类提示。" />
  <title>垃圾分类助手 · LensLab</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b3229'/%3E%3Cpath d='M11 10h10M13 7h6M9 12l1 13h12l1-13' fill='none' stroke='%23d7f673' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand-icon" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="brand-copy"><span class="brand-name">垃圾分类助手</span><span class="brand-sub">拍一下，看看怎么投</span></div>
      <span class="local-badge"><i></i>本地识别</span>
    </header>
    <section class="viewer" aria-label="待识别照片">
      <div class="viewer-empty" id="viewerEmpty">
        <div class="scan-art" aria-hidden="true"><span class="scan-corner tl"></span><span class="scan-corner tr"></span><span class="scan-corner bl"></span><span class="scan-corner br"></span><span class="scan-object">♻</span></div>
        <p class="empty-title">对准物品，拍张照片</p>
        <p class="empty-sub">也可以从相册选择一张清晰的图片</p>
      </div>
      <img id="preview" class="preview hidden" alt="待分类物品照片" />
      <div id="loading" class="loading hidden" role="status"><span class="spinner"></span><span id="loadingText">正在识别…</span></div>
      <button id="clearButton" class="clear-button hidden" type="button" aria-label="移除照片">重拍 ×</button>
    </section>
    <section id="result" class="result-card" aria-live="polite">
      <div class="result-top"><span class="result-kicker">分类结果</span><span id="confidence" class="confidence hidden"></span></div>
      <div class="result-main"><span id="resultIcon" class="result-icon" aria-hidden="true">⌕</span><div class="result-copy"><h1 id="resultCategory">等待照片</h1><p id="resultItem">拍照或选图后显示分类建议</p></div></div>
      <p id="resultAdvice" class="result-advice">建议只拍一个物品，保持光线充足。</p>
    </section>
    <div class="actions">
      <input id="cameraInput" class="visually-hidden" type="file" accept="image/*" capture="environment" />
      <input id="albumInput" class="visually-hidden" type="file" accept="image/*" />
      <button id="cameraButton" class="camera-button" type="button"><span class="action-icon" aria-hidden="true">◎</span>拍照识别</button>
      <button id="albumButton" class="album-button" type="button"><span class="action-icon" aria-hidden="true">▧</span>相册选图</button>
    </div>
    <p class="disclaimer">分类仅供参考，请结合物品材质、污染情况和当地规定。</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
