<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>垃圾分类助手 · 公网二维码</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23161b19'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23d6f25b'/%3E%3C/svg%3E" />
    <style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f8f3;color:#1b3229;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.qr-card{width:min(420px,calc(100% - 28px));background:#fff;border:1px solid #e5ebe3;border-radius:24px;padding:28px 16px;text-align:center}.qr-card h1{font-size:26px;letter-spacing:-.04em;margin:0 0 10px}.qr-card p{color:#718077;font-size:12px;line-height:1.7}.qr-box{background:#fff;padding:18px;display:inline-block;margin:12px 0}.qr-box img{display:block}.url{font:10px monospace;color:#718077;word-break:break-all}</style>
  </head>
  <body>
    <main class="qr-card"><h1>扫码，垃圾分类更轻松</h1><p>拍照或相册选图，获取常见物品的分类提示。</p><div class="qr-box" id="qrcode"></div><div class="url" id="url"></div></main>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script>const target = new URLSearchParams(location.search).get('url') || location.origin + location.pathname.replace(/qr\.html$/, ''); document.querySelector('#url').textContent = target; new QRCode(document.querySelector('#qrcode'), { text: target, width: 220, height: 220, colorDark: '#161b19', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H });</script>
  </body>
</html>
