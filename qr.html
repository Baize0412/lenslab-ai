<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LensLab · 公网二维码</title>
    <link rel="stylesheet" href="styles.css" />
    <style>body{min-height:100vh;display:grid;place-items:center}.qr-card{width:min(420px,calc(100% - 34px));background:#f8f5ed;border:1px solid #d8d6cd;padding:34px;text-align:center}.qr-card h1{font-size:30px;letter-spacing:-.06em;margin:0 0 10px}.qr-card p{color:#747b74;font-size:12px;line-height:1.7}.qr-box{background:#fff;padding:18px;display:inline-block;margin:20px 0}.qr-box img{display:block}.url{font:10px 'DM Mono',monospace;color:#747b74;word-break:break-all}</style>
  </head>
  <body>
    <main class="qr-card"><p class="eyebrow" style="justify-content:center"><span class="eyebrow-line"></span>LENS·LAB<span class="eyebrow-line"></span></p><h1>扫码打开识别工具</h1><p>把这个二维码分享给朋友，随时在手机浏览器里使用 LensLab。</p><div class="qr-box" id="qrcode"></div><div class="url" id="url"></div></main>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script>const target = new URLSearchParams(location.search).get('url') || location.origin + location.pathname.replace(/qr\.html$/, ''); document.querySelector('#url').textContent = target; new QRCode(document.querySelector('#qrcode'), { text: target, width: 220, height: 220, colorDark: '#161b19', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H });</script>
  </body>
</html>
